services:
  mysql-db:
    image: mysql:latest
    container_name: dbgrep-mysql-container
    restart: always
    environment:
      MYSQL_DATABASE: dbgrep-database
      MYSQL_ROOT_PASSWORD: test
    ports:
      - 3306:3306
    volumes:
      - db_mysql:/var/lib/mysql
      - ./db-init-scripts/mysql:/docker-entrypoint-initdb.d

  postgres-db:
    image: postgres:latest
    container_name: dbgrep-postgres-container
    restart: always
    environment:
      POSTGRES_DB: dbgrep-database
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test
    ports:
      - 5432:5432
    volumes:
      - db_postgres:/var/lib/postgresql/data
      - ./db-init-scripts/postgres:/docker-entrypoint-initdb.d
# Gibt unseren Volumes einen Namen innerhalb von Docker
volumes:
  db_mysql:
  db_postgres:

